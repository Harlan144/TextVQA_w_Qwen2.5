model:
  name: "Qwen/Qwen2.5-VL-3B-Instruct"
  dtype: "bfloat16"       # "bfloat16" or "4bit"
  device_map: "auto"
  max_new_tokens: 128

data:
  dataset: "lmms-lab/textvqa"
  cache_dir: null          # defaults to HF cache
  max_samples: null        # null = use all; set int for quick dev runs

evaluation:
  batch_size: 1            # per-GPU batch size for inference
  metrics:
    - vqa_accuracy
    - bleu
    - meteor
    - rouge
    - f1
    - precision_recall
    - llm_judge

output:
  base_dir: "results"

seed: 42
