model:
  name: "Qwen/Qwen2.5-VL-3B-Instruct"
  dtype: "bfloat16"
  device_map: "auto"
  max_new_tokens: 128

data:
  dataset: "lmms-lab/textvqa"
  cache_dir: null
  max_samples: null

strategies:
  - baseline
  - ocr_augmented
  - chain_of_thought
  - instructed_concise
  - ocr_cot

split: "validation"

evaluation:
  metrics:
    - vqa_accuracy
    - bleu
    - meteor
    - rouge
    - f1

output:
  base_dir: "results"

seed: 42
